appId: com.app.RunnrHost
---
- launchApp:
    clearState: true

- scrollUntilVisible:
    element: Reboot SDK
- tapOn: Generate Random User ID
- doubleTapOn: Reboot SDK

# Nudge Trigger
- scrollUntilVisible:
    direction: UP
    element: Event Name

- extendedWaitUntil:
    visible:
      text: Guide/Survey Flag Key
    timeout: 20000

- tapOn:
    text: Guide/Survey Flag Key
    retryTapIfNoChange: false
    repeat: 2
    delay: 3000
- inputText: "guide-e2e-modal-b67"
- tapOn: Show Guide/Survey

# Assert
- assertVisible: This is a modal nudge
- assertVisible: Hello this is a sample content for modal nudge

# Check if close is working
- tapOn: Close
- assertNotVisible: This is a modal nudge
