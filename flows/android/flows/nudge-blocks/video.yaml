appId: app.runnr.android
---
- launchApp:
    clearState: true

- scrollUntilVisible:
    element: Reboot SDK
- tapOn: 🎲 Generate Random User ID
- doubleTapOn: Reboot SDK

- extendedWaitUntil:
    visible:
      text: Tooltip Marker
    timeout: 20000

# Nudge Trigger
- doubleTapOn: Guide/Survey Flag Key
- inputText: "survey-e2e-image-597"
- tapOn: Show Guide/Survey

- extendedWaitUntil:
    visible:
      text: YouTube Home
    timeout: 20000

- tapOn: Close
- assertNotVisible: YouTube Home
